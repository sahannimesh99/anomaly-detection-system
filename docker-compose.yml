version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: anomaly-mysql
    environment:
      MYSQL_ROOT_PASSWORD: sahan
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psahan"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-service:
    build:
      context: ./ai-service
    container_name: anomaly-ai-service
    ports:
      - "5000:5000"
    restart: always

  user-service:
    build:
      context: ./user-service
    container_name: anomaly-user-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/user_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: sahan
      AI_SERVICE_URL: http://ai-service:5000/detect
    depends_on:
      mysql:
        condition: service_healthy
      ai-service:
        condition: service_started
    restart: always

  order-service:
    build:
      context: ./order-service
    container_name: anomaly-order-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/order_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: sahan
      AI_SERVICE_URL: http://ai-service:5000/detect
    depends_on:
      mysql:
        condition: service_healthy
      ai-service:
        condition: service_started
    restart: always

  payment-service:
    build:
      context: ./payment-service
    container_name: anomaly-payment-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/payment_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: sahan
      AI_SERVICE_URL: http://ai-service:5000/detect
    depends_on:
      mysql:
        condition: service_healthy
      ai-service:
        condition: service_started
    restart: always

  api-gateway:
    build:
      context: ./api-gateway
    container_name: anomaly-api-gateway
    ports:
      - "8080:8080"
    environment:
      USER_SERVICE_URL: http://user-service:8081
      ORDER_SERVICE_URL: http://order-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8083
      AI_SERVICE_URL: http://ai-service:5000
    depends_on:
      - user-service
      - order-service
      - payment-service
      - ai-service
    restart: always

  portal:
    build:
      context: ../anomaly-detection-system-portal
    container_name: anomaly-portal
    ports:
      - "5173:80"
    depends_on:
      - api-gateway
    restart: always

volumes:
  mysql_data:
